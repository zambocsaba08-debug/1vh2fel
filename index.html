<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Első Világháború Kvíz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .powers {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        .power {
            width: 40%;
            padding: 15px;
            border-radius: 10px;
            color: white;
        }

        .allies {
            background: #2e86de;
        }

        .central {
            background: #c0392b;
        }

        .question {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eee;
        }

        button {
            padding: 10px 15px;
            margin-top: 10px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        .correct {
            background-color: #2ecc71 !important;
            color: white;
        }

        .wrong {
            background-color: #e74c3c !important;
            color: white;
        }

        #result {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Első Világháború Kvíz</h1>

    <div class="powers">
        <div class="power allies">
            <h2>Antant</h2>
            <p>Franciaország</p>
            <p>Egyesült Királyság</p>
            <p>Oroszország</p>
        </div>

        <div class="power central">
            <h2>Központi Hatalmak</h2>
            <p>Németország</p>
            <p>Osztrák–Magyar Monarchia</p>
            <p>Oszmán Birodalom</p>
        </div>
    </div>

    <form id="quizForm">

        <div id="questions"></div>

        <button type="button" onclick="checkAnswers()">Eredmény</button>
    </form>

    <div id="result"></div>
</div>

<script>
const quizData = [
    {
        question: "Mikor kezdődött az első világháború?",
        options: ["1912", "1914", "1918", "1939"],
        answer: "1914"
    },
    {
        question: "Melyik ország tartozott az Antanthoz?",
        options: ["Németország", "Oszmán Birodalom", "Franciaország", "Bulgária"],
        answer: "Franciaország"
    },
    {
        question: "Ki ellen harcolt Németország?",
        options: ["Antant", "Japán", "Svájc", "Svédország"],
        answer: "Antant"
    },
    {
        question: "Melyik birodalom volt a Központi Hatalmak része?",
        options: ["Brit Birodalom", "Oszmán Birodalom", "Orosz Birodalom", "Franciaország"],
        answer: "Oszmán Birodalom"
    },
    {
        question: "Ki volt a trónörökös, akinek meggyilkolása kiváltotta a háborút?",
        options: ["Ferenc Ferdinánd", "Napóleon", "Vilmos császár", "Lenin"],
        answer: "Ferenc Ferdinánd"
    },
    {
        question: "Hol történt a merénylet?",
        options: ["Berlin", "Budapest", "Szarajevó", "Párizs"],
        answer: "Szarajevó"
    },
    {
        question: "Melyik ország NEM volt központi hatalom?",
        options: ["Németország", "Olaszország", "Osztrák–Magyar Monarchia", "Oszmán Birodalom"],
        answer: "Olaszország"
    },
    {
        question: "Mikor ért véget a háború?",
        options: ["1916", "1917", "1918", "1920"],
        answer: "1918"
    },
    {
        question: "Melyik szerződés zárta le a háborút?",
        options: ["Trianoni", "Versailles-i", "Párizsi", "Bécsi"],
        answer: "Versailles-i"
    },
    {
        question: "Ki volt Németország vezetője?",
        options: ["II. Vilmos", "Hitler", "Sztálin", "Churchill"],
        answer: "II. Vilmos"
    },
    {
        question: "Melyik ország lépett be később az Antant oldalán?",
        options: ["USA", "Németország", "Bulgária", "Törökország"],
        answer: "USA"
    },
    {
        question: "Milyen harcmodor volt jellemző?",
        options: ["Légi csata", "Tankcsata", "Árokháború", "Űrháború"],
        answer: "Árokháború"
    },
    {
        question: "Melyik fegyvert használták először nagy számban?",
        options: ["Lézer", "Vegyi fegyver", "Rakéta", "Atomfegyver"],
        answer: "Vegyi fegyver"
    },
    {
        question: "Melyik ország volt az Antant része?",
        options: ["Oroszország", "Bulgária", "Németország", "Ausztria"],
        answer: "Oroszország"
    },
    {
        question: "Melyik kontinensen zajlott főként a háború?",
        options: ["Ázsia", "Afrika", "Európa", "Ausztrália"],
        answer: "Európa"
    }
];

const questionsDiv = document.getElementById("questions");

quizData.forEach((q, index) => {
    const div = document.createElement("div");
    div.classList.add("question");

    div.innerHTML = `
        <h3>${index + 1}. ${q.question}</h3>
        ${q.options.map(option => `
            <label>
                <input type="radio" name="q${index}" value="${option}">
                ${option}
            </label><br>
        `).join("")}
    `;

    questionsDiv.appendChild(div);
});

function checkAnswers() {
    let score = 0;

    quizData.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const questionDiv = document.getElementsByClassName("question")[index];

        questionDiv.classList.remove("correct", "wrong");

        if (selected) {
            if (selected.value === q.answer) {
                score++;
                questionDiv.classList.add("correct");
            } else {
                questionDiv.classList.add("wrong");
            }
        } else {
            questionDiv.classList.add("wrong");
        }
    });

    document.getElementById("result").innerHTML =
        `Pontszám: ${score} / ${quizData.length}`;
}
</script>

</body>
</html>
